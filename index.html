<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Mumber Shop - Robux Top Up</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="container">
    <h1>MUMBER SHOP</h1>
    <p class="subtitle">Fast Roblox Top Up Delivery</p>

    <div class="card">
      <h2>Select Package</h2>

      <select id="product">
        <option value="80 Robux - RM3">80 Robux - RM3</option>
        <option value="400 Robux - RM13">400 Robux - RM13</option>
        <option value="800 Robux - RM26">800 Robux - RM26</option>
      </select>

      <input type="text" id="username" placeholder="Roblox Username">
      <input type="text" id="contact" placeholder="WhatsApp Number">

      <button onclick="submitOrder()">Place Order</button>

      <p id="msg"></p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
