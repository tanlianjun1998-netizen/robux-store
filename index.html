<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Mumber Shop Pro</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <h1>MUMBER SHOP</h1>
  <button onclick="openAdmin()">Admin</button>
</header>

<section class="hero">
  <h2>Fast Digital Top-Up Store</h2>
  <p>Secure • Instant Process • Trusted</p>
</section>

<section class="products">

  <div class="product">
    <img src="https://via.placeholder.com/150" />
    <h3>80 Robux</h3>
    <p>RM3</p>
  </div>

  <div class="product">
    <img src="https://via.placeholder.com/150" />
    <h3>400 Robux</h3>
    <p>RM13</p>
  </div>

  <div class="product">
    <img src="https://via.placeholder.com/150" />
    <h3>800 Robux</h3>
    <p>RM26</p>
  </div>

</section>

<section class="order">

  <h2>Place Order</h2>

  <input id="username" placeholder="Username">
  <input id="contact" placeholder="WhatsApp">

  <select id="product">
    <option>80 Robux - RM3</option>
    <option>400 Robux - RM13</option>
    <option>800 Robux - RM26</option>
  </select>

  <button onclick="showPayment()">Continue to Pay</button>

</section>

<!-- PAYMENT MODAL -->
<div id="paymentBox" class="modal">

  <div class="modal-content">
    <h2>Scan to Pay</h2>

    <img src="QR.png" class="qr">

    <p>After payment click confirm</p>

    <button onclick="submitOrder()">I Have Paid</button>

  </div>

</div>

<script src="script.js"></script>
</body>
</html>
